name: Build SipSaviya APK

# Builds the release APK on GitHub's free runners and attaches it to a
# GitHub Release, so students can always grab the newest file from:
#   https://github.com/Rusindu12/1234/releases/latest/download/SipSaviya.apk

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - "tools/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK platform 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Validate content + AI (build fails if broken)
        run: python3 tools/build_web.py

      - name: UI smoke test (jsdom)
        run: |
          npm install --no-audit --no-fund --silent
          node tools/ui_test.js

      - name: Create the app signing key (first run only)
        run: |
          if [ ! -f android/signing/sipsaviya-release.jks ]; then
            mkdir -p android/signing
            keytool -genkeypair -v \
              -keystore android/signing/sipsaviya-release.jks \
              -storepass sipsaviya -keypass sipsaviya \
              -alias sipsaviya -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SipSaviya, OU=Free Education For All, O=SipSaviya, L=Colombo, C=LK"
            git config user.name "SipSaviya Builder"
            git config user.email "builder@users.noreply.github.com"
            git add -f android/signing/sipsaviya-release.jks
            git commit -m "chore(signing): add release key so every build stays update-compatible [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/SipSaviya.apk
          ls -lh dist
          sha256sum dist/SipSaviya.apk | tee dist/SipSaviya.apk.sha256

      - name: Verify APK contents (assets, icons, signature)
        run: |
          set -e
          APK=dist/SipSaviya.apk
          echo "── APK size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" > apk_list.txt
          echo "── web assets bundled:"
          grep -E "assets/www/(index.html|css/app.css|js/app.js|js/ai/brain.js|data/kb-maths.js|data/manifest.json)" apk_list.txt | awk '{print "   " $4}'
          for f in assets/www/index.html assets/www/css/app.css assets/www/js/app.js \
                   assets/www/js/ai/nlp.js assets/www/js/ai/embed.js assets/www/js/ai/solver.js \
                   assets/www/js/ai/brain.js assets/www/js/ai/study.js \
                   assets/www/data/subjects.js assets/www/data/kb-maths.js assets/www/data/kb-science.js \
                   assets/www/data/kb-lang.js assets/www/data/kb-other.js assets/www/data/quiz.js \
                   assets/www/data/manifest.json; do
            grep -q "$f" apk_list.txt || { echo "MISSING $f"; exit 1; }
          done
          ICONS=$(grep -cE "res/mipmap-.*/ic_launcher.*\.png" apk_list.txt || true)
          echo "── launcher icons in APK: $ICONS"
          [ "$ICONS" -ge 8 ] || { echo "launcher icons missing"; exit 1; }
          SDK_BT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/34.0.0"
          if [ -x "$SDK_BT/apksigner" ]; then
            "$SDK_BT/apksigner" verify --print-certs "$APK" | head -5
          fi
          echo "✔ APK verified"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SipSaviya-apk
          path: dist/*
          retention-days: 90

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=$(grep -m1 -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          TAG="v${TAG}"
          SIZE=$(du -h dist/SipSaviya.apk | cut -f1)
          NOTES=$(cat <<EOF
          ## 📚 සිප්සවිය / SipSaviya $TAG

          **ශ්‍රී ලංකාවේ සිසුන් සඳහා නොමිලේ, සම්පූර්ණයෙන්ම offline අධ්‍යාපන යෙදුමක්.**
          A free, fully offline study app for Sri Lankan students — school books, past
          papers, practice questions and an AI tutor that runs **on the phone itself**.

          ### ✨ මොනවද තියෙන්නේ / What's inside
          | | |
          |---|---|
          | 📚 පාසල් පොත් | Grades 1–13, Sinhala / Tamil / English — free official EPD textbooks |
          | 📝 පසුගිය ප්‍රශ්න | Grade 5, O/L & A/L past papers 2015–2025 with marking schemes |
          | 🤖 AI ගුරුවරයා | Step-by-step answers in Sinhala/English — no internet, no data leaves the phone |
          | 🎯 පුහුණු ප්‍රශ්න | 45 MCQs + 24 flashcards with explanations, per subject |
          | 📅 කාලසටහන | Study plan built from your exam date and daily free time |
          | 🌙 පෙනුම | Light/dark theme, 23 subjects, grades 1–13 |

          ### 📲 ස්ථාපනය කරන ආකාරය / How to install
          1. **SipSaviya.apk** (below, $SIZE) බාගන්න — download the APK.
          2. ෆෝන් එකේ *Settings → Apps → Special access → Install unknown apps* එකෙන්
             බ්‍රවුසරයට/file manager එකට අවසර දෙන්න (once, for the browser or file manager).
          3. බාගත කළ ගොනුව ඔබන්න → **Install**. Update කිරීමට අලුත් APK එක උඩින් install කරන්න.
          4. No account, no ads, no in-app payments, no internet needed after install.

          ### 🔒 නොමිලේ හා ආරක්ෂිතයි / Free & private
          GPL-3.0 licensed. Content links point to the official free sources
          (Educational Publications Dept, Department of Examinations, e-Thaksalawa) —
          we never rehost copyrighted PDFs. The AI is written from scratch in plain
          JavaScript with zero third-party dependencies and makes **no network calls**.

          Built automatically from \`${GITHUB_SHA:0:7}\` · sha256 in \`SipSaviya.apk.sha256\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SipSaviya.apk dist/SipSaviya.apk.sha256 --clobber
          else
            gh release create "$TAG" dist/SipSaviya.apk dist/SipSaviya.apk.sha256 \
              --title "SipSaviya $TAG" --notes "$NOTES"
          fi
          echo "Release published: $TAG"
