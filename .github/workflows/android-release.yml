name: Build SipSaviya APK

# Builds the release APK on GitHub's free runners and attaches it to a
# GitHub Release, so students can always grab the newest file from:
#   https://github.com/Rusindu12/1234/releases/latest/download/SipSaviya.apk

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "android/**"
      - "tools/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK platform 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Build web content (icons + data checks)
        run: python3 tools/build_web.py --verify

      - name: Create the app signing key (first run only)
        run: |
          if [ ! -f android/signing/sipsaviya-release.jks ]; then
            mkdir -p android/signing
            keytool -genkeypair -v \
              -keystore android/signing/sipsaviya-release.jks \
              -storepass sipsaviya -keypass sipsaviya \
              -alias sipsaviya -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SipSaviya, OU=Free Education For All, O=SipSaviya, L=Colombo, C=LK"
            git config user.name "SipSaviya Builder"
            git config user.email "builder@users.noreply.github.com"
            git add -f android/signing/sipsaviya-release.jks
            git commit -m "chore(signing): add release key so every build stays update-compatible [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/SipSaviya.apk
          ls -lh dist
          sha256sum dist/SipSaviya.apk | tee dist/SipSaviya.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SipSaviya-apk
          path: dist/*
          retention-days: 90

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=$(grep -m1 -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          TAG="v${TAG}"
          NOTES=$(printf 'සිප්සවිය / SipSaviya %s\n\nFree Sri Lankan school books, past papers, a study planner and an offline AI tutor.\nBuilt automatically from %s.\n\nInstall: download the APK below, then allow "Install unknown apps" for your browser/file manager.\n' "$TAG" "${GITHUB_SHA:0:7}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SipSaviya.apk dist/SipSaviya.apk.sha256 --clobber
          else
            gh release create "$TAG" dist/SipSaviya.apk dist/SipSaviya.apk.sha256 \
              --title "SipSaviya $TAG" --notes "$NOTES"
          fi
          echo "Release published: $TAG"
